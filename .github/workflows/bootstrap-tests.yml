name: Portable bootstrap tests
on:
  push:
    paths: ['bootstrap.py', 'bootstrap-*.json', 'setup.sh', 'setup.ps1', 'scripts/assemble_bootstrap_release.py', 'tests/**', '.github/workflows/bootstrap-tests.yml']
  pull_request:
    paths: ['bootstrap.py', 'bootstrap-*.json', 'setup.sh', 'setup.ps1', 'scripts/assemble_bootstrap_release.py', 'tests/**', '.github/workflows/bootstrap-tests.yml']
permissions:
  contents: read
jobs:
  isolated-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile bootstrap.py scripts/assemble_bootstrap_release.py
      - if: runner.os != 'Windows'
        run: sh -n setup.sh
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'setup.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { throw ($errors | Out-String) }
